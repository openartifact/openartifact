# A service account for a CI pipeline, the permission it needs, and the trust
# policy that lets the GitHub Actions jobs of one repository exchange their ID
# token for a short-lived token of that account (see docs/integrations/ci.md).
# A service account cannot sign in and has no password; applying this creates
# the account, and tokens come from the exchange or from the API.
apiVersion: openartifact.io/v1
kind: ServiceAccount
metadata:
  name: ci-publisher
spec:
  description: Publishes release builds from GitHub Actions
---
# A service account is assigned like a user.
apiVersion: openartifact.io/v1
kind: PermissionTarget
metadata:
  name: ci-publisher-npm
spec:
  repository_filter: "npm-hosted"
  path_pattern: ".*"
  actions: [read, write]
  assignments:
    users: [ci-publisher]
---
# Conditions are ANDed across entries and ORed within one entry's patterns.
# The shared GitHub issuer needs a condition on an identity claim such as
# repository, with a pattern that starts with a literal character: the server
# refuses the policy otherwise. token_ttl_seconds is 60 to 3600 (default 900).
apiVersion: openartifact.io/v1
kind: OIDCTrustPolicy
metadata:
  name: github-release
spec:
  issuer: https://token.actions.githubusercontent.com
  audience: https://oa.example.com
  service_account: ci-publisher
  conditions:
    - claim: repository
      patterns: [acme/shop]
    - claim: ref
      patterns: ["refs/tags/v*"]
  token_ttl_seconds: 900
  enabled: true
---
# Tekton and other Kubernetes pipelines: every pod can have a projected service
# account token whose audience is this server. The cluster API server is the
# issuer; OpenArtifact reads its keys with its own service account token
# (discovery mode serviceaccount, see "Kubernetes and Tekton service accounts"
# in docs/integrations/ci.md). The API server lives on a cluster-internal
# address, so the policy opts into private issuers. A claim may be a dotted
# path into nested claims: kubernetes.io.namespace is the "namespace" key of
# the "kubernetes.io" claim.
apiVersion: openartifact.io/v1
kind: OIDCTrustPolicy
metadata:
  name: tekton-team-a
spec:
  issuer: https://kubernetes.default.svc
  audience: https://oa.example.com
  service_account: ci-publisher
  discovery:
    mode: serviceaccount
  allow_private_issuer: true
  conditions:
    - claim: sub
      patterns: ["system:serviceaccount:team-a:build-pipeline-*"]
    - claim: kubernetes.io.namespace
      patterns: [team-a]
  token_ttl_seconds: 600
  enabled: true
---
# A cluster whose issuer is not reachable from here (or does not serve
# discovery anonymously) can be trusted from a key set stored on the policy:
# static mode never contacts the issuer, takes public keys only, and the token's
# iss claim must still equal the issuer below. Export the set from the cluster
# with: kubectl get --raw /openid/v1/jwks
apiVersion: openartifact.io/v1
kind: OIDCTrustPolicy
metadata:
  name: tekton-edge-cluster
spec:
  issuer: https://oidc.edge.example.com
  audience: https://oa.example.com
  service_account: ci-publisher
  discovery:
    mode: static
    jwks:
      keys:
        - kty: RSA
          use: sig
          alg: RS256
          kid: edge-2024
          e: AQAB
          n: sXchDaQebHnPiGvyDOAT4saGEUetSyo9MKLOoWFsueri23bOdgWp4Dy1WlUzewbgBHod5pcM9H95GQRV3JDXboIRROSBigeC5yjU1hGzHHyXss8UDprecbAYxknTcQkhslANGRUZmdTOQ5qTRsLAt6BTYuyvVRdhS8exSZEy_c4gs_7svlJJQ4H9_NxsiIoLwAEk7-Q3UXERGYw_75IDrGA84-lA_-Ct4eTlXHBIY2EaV7t7LjJaynVJCpkv4LKjTTAumiGUIuQhrNhZLuF_RJLqHpM2kgWFLU7-VTdL1VbC2tejvcI2BlMkEpk1BzBZI0KQB0GaDWFLN-aEAw3vRw
  conditions:
    - claim: sub
      patterns: ["system:serviceaccount:team-a:*"]
