version: 2

before:
  hooks:
    # The server embeds web/dist; build the UI before compiling.
    - sh -c "cd web && bun install --frozen-lockfile && bun run build"
    # Shell completion scripts of the oa archive (completions/), generated from the CLI at this commit.
    - scripts/completions.sh

builds:
  - id: openartifact
    main: ./cmd/server
    binary: openartifact
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    # Drops gRPC's net/trace debug pages (unused), see docker/Dockerfile.
    tags: [grpcnotrace]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{ slice .FullCommit 0 7 }}
      - -X main.buildTime={{ .Date }}
    goos: [linux]
    goarch: [amd64, arm64]
  - id: resetpw
    main: ./cmd/resetpw
    binary: resetpw
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    goos: [linux]
    goarch: [amd64, arm64]
  - id: oa
    main: ./cmd/oa
    binary: oa
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: openartifact
    ids: [openartifact, resetpw]
    formats: [tar.gz]
    name_template: "openartifact_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - openartifact.example.yaml
      - src: .env.example
        dst: .env.example
  - id: oa
    ids: [oa]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "oa_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      # bash, zsh, fish and PowerShell completion (docs/integrations/cli.md#shell-completion)
      - src: completions/*
        dst: completions
        strip_parent: true

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

# Native packages (deb: Debian 12/13, rpm: Fedora/RHEL/CentOS/openSUSE), built
# from the same binaries as the archives. Two independent packages so the
# server and the CLI can be installed separately or together. GoReleaser puts
# the binaries of the builds listed in ids into /usr/bin automatically.
nfpms:
  - id: server
    package_name: openartifact
    ids: [openartifact, resetpw]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: OpenArtifact
    maintainer: The OpenArtifact Authors <openartifact@users.noreply.github.com>
    homepage: https://github.com/openartifact/openartifact
    description: |-
      Self-hosted, multi-format artifact repository server: serves Maven, npm,
      PyPI, Docker/OCI, Helm, Debian, RPM, Alpine (apk), Pacman, Go, Cargo,
      NuGet, RubyGems, Composer, Conda, Conan, Ivy, sbt, Terraform, Ansible,
      Nix and raw formats. Ships the server binary, the resetpw tool, a systemd
      unit and its config. Needs your own PostgreSQL.
    license: AGPL-3.0-or-later
    formats: [deb, rpm]
    contents:
      # conffile: upgrades keep local edits (rpm needs noreplace for that; plain
      # config replaces an edited file and saves it as .rpmsave). It holds the
      # database password: postinstall gives it to the openartifact group.
      - src: openartifact.example.yaml
        dst: /etc/openartifact/openartifact.yaml
        type: config|noreplace
        file_info:
          mode: 0640
      - src: packaging/systemd/openartifact.service
        dst: /usr/lib/systemd/system/openartifact.service
    scripts:
      postinstall: packaging/server/postinstall.sh
      preremove: packaging/server/preremove.sh
  - id: cli
    package_name: oa
    ids: [oa]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: OpenArtifact
    maintainer: The OpenArtifact Authors <openartifact@users.noreply.github.com>
    homepage: https://github.com/openartifact/openartifact
    description: |-
      Command-line client for OpenArtifact: manage repositories, users, tokens,
      scans, webhooks and backups, apply declarative manifests and import from
      Nexus or Artifactory.
    license: AGPL-3.0-or-later
    formats: [deb, rpm]
    contents:
      - src: completions/oa.bash
        dst: /usr/share/bash-completion/completions/oa
      # zsh completion lives in a different directory on each side
      - src: completions/_oa
        dst: /usr/share/zsh/vendor-completions/_oa
        packager: deb
      - src: completions/_oa
        dst: /usr/share/zsh/site-functions/_oa
        packager: rpm
      - src: completions/oa.fish
        dst: /usr/share/fish/vendor_completions.d/oa.fish

release:
  github:
    owner: openartifact
    name: openartifact
  name_template: "OpenArtifact {{ .Version }}"
  footer: |
    Container image (linux/amd64, linux/arm64):

    ```sh
    docker pull ghcr.io/openartifact/openartifact:{{ .Version }}
    ```

changelog:
  use: github
  sort: asc
  abbrev: 0
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]/.-]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]/.-]+\))??!?:.+$'
      order: 1
    - title: CI and build
      regexp: '^.*?(ci|build)(\([[:word:]/.-]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^Merge '
      - '^chore\(release\):'
