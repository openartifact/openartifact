# OpenArtifact configuration file
# All values here can be overridden by environment variables.
# Validate with: openartifact verify openartifact.yaml
# Start with:    openartifact -config openartifact.yaml (or OPENARTIFACT_CONFIG=...)

server:
  host: "0.0.0.0"
  port: 8080
  # 0 (default) = unlimited so large uploads are never truncated
  # readTimeout: 0       # seconds
  # writeTimeout: 0      # seconds
  shutdownTimeout: 30  # seconds
  # tlsEnabled: false
  # tlsCert: /etc/openartifact/tls/cert.pem
  # tlsKey: /etc/openartifact/tls/key.pem
  # Replace with the trusted browser origin.
  corsOrigins:
    - "https://app.example.com"
  # ipAllowlist:
  #   - "10.0.0.0/8"
  #   - "192.168.0.0/16"
  # rateLimitRps: 100
  # pprofEnabled: false     # Go profiler at /api/v1/admin/pprof/ (admin only); env OPENARTIFACT_PPROF_ENABLED
  # readHeaderTimeout: 10   # seconds
  # maxBodyBytes: 17179869184  # max request body for every endpoint (16 GiB); 0 = unlimited
  # trustedProxies:         # CIDRs whose X-Forwarded-For is trusted
  #   - "10.0.0.0/8"
  # apiKey: ""              # legacy write API key
  # instanceId: "node-1"

baseUrl: "http://localhost:8080"

database:
  driver: "postgres"
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "CHANGE_ME"
  database: "artifact_repo"
  # "require" by default; use "disable" only for local development without TLS.
  sslMode: "require"
  # Extra libpq connection parameters (env: DB_OPTIONS=key=value,key=value).
  # options:
  #   connect_timeout: "5"
  maxOpenConns: 25
  maxIdleConns: 5
  connMaxLifetimeMinutes: 30
  # How long startup keeps retrying the initial database connection (capped
  # exponential backoff) before exiting; 0 fails immediately
  # (env: DB_CONNECT_TIMEOUT, e.g. 60s).
  connectTimeout: 60s
  # In-memory cache for per-request auth lookups (token, user, groups,
  # permission targets, repository by name). Changes made through this
  # instance take effect immediately; other replicas see them after at most
  # this many milliseconds. 0 disables the cache.
  authCacheTtlMs: 2000

storage:
  # type: filesystem | s3 | gcs | azure | garage | seaweedfs | oci
  type: "filesystem"
  # Free-form backend options (env: STORAGE_OPTIONS=key=value,key=value).
  # options: {}
  path: "/var/lib/artifacts"
  # S3 / S3-compatible:
  # type: s3
  # bucket: openartifact
  # region: us-east-1
  # accessKey: CHANGE_ME
  # secretKey: CHANGE_ME
  # endpoint: http://garage:3900
  # forcePathStyle: true
  # presignTtl: 5m
  # Direct downloads via presigned URLs (s3 / gcs only; off by default):
  # presignDownloads: true
  # presignMinSize: 1048576      # bytes; smaller blobs are streamed, 0 = redirect all
  # presignEndpoint: https://s3.example.com   # public URL for signing only, when endpoint is internal
  # presignUploadTtl: 30m        # clamped to 1m..12h
  # presignMaxPendingUploads: 20 # outstanding presigned uploads per user, 0 = unlimited
  # GCS (S3-compatible XML API):
  # gcsBucket: my-bucket
  # gcsHmacKey: CHANGE_ME
  # gcsHmacSecret: CHANGE_ME
  # Azure Blob:
  # azureAccountName: myaccount
  # azureAccountKey: CHANGE_ME
  # azureContainerName: artifacts
  # azureEndpoint: http://azurite:10000/devstoreaccount1   # Azurite / sovereign cloud; empty = https://<account>.blob.core.windows.net
  # OCI registry:
  # ociUsername: user
  # ociPassword: CHANGE_ME
  # ociInsecure: false
  # stagingPath: /var/lib/artifacts-staging   # spool dir for server-relayed presigned uploads (oci only)
  # Blob replication: an async second copy on another backend with read
  # fallback and verify/repair (docs/operations/replication.md). Active when
  # type is set. It takes the same backend keys as above; env: OPENARTIFACT_STORAGE_REPLICA_*.
  # replica:
  #   type: s3                  # filesystem | s3 | gcs | azure | garage | seaweedfs | oci
  #   bucket: openartifact-replica
  #   region: eu-central-1
  #   accessKey: CHANGE_ME
  #   secretKey: CHANGE_ME
  #   # endpoint: http://garage:3900
  #   # forcePathStyle: true
  #   # path: /mnt/replica/artifacts   # filesystem replica
  #   # options: {}                    # free-form backend options
  #   # gcsBucket: my-replica-bucket
  #   # gcsHmacKey: CHANGE_ME
  #   # gcsHmacSecret: CHANGE_ME
  #   # azureAccountName: myaccount
  #   # azureAccountKey: CHANGE_ME
  #   # azureContainerName: artifacts-replica
  #   # azureEndpoint: http://azurite:10000/devstoreaccount1   # Azurite / sovereign cloud; empty = public cloud
  #   # ociUsername: user
  #   # ociPassword: CHANGE_ME
  #   # ociInsecure: false
  #   readFallback: notfound    # notfound | error | off: when reads fall back to the replica
  #   interval: 5s              # pause between queue passes
  #   batch: 100                # operations claimed per pass
  #   concurrency: 4            # blobs copied at once
  #   verifyInterval: 24h       # between full verify passes; 0 = only when an admin requests one
  #   verifyDeep: false         # hash both copies in verify passes (expensive)
  #   maxBackoff: 1h            # longest retry delay of a failing operation

log:
  level: "info"    # debug | info | warn | error
  format: "json"   # json | text
  output: "stdout"

# OpenTelemetry traces over OTLP, off by default. Every key has an environment
# override, the standard OTEL_* variables where one exists (see .env.example);
# /metrics is unaffected.
telemetry:
  otlp:
    enabled: false
    # endpoint: "otel-collector:4317"   # host:port or http(s) URL; empty = SDK default (localhost)
    # protocol: "grpc"                  # grpc | http
    # headers:                          # sent with every export (collector credentials)
    #   authorization: "Bearer CHANGE_ME"
    # insecure: false                   # plaintext to the collector (implied by an http:// endpoint)
    # serviceName: "openartifact"
    # sampleRatio: 1.0                  # fraction of new traces recorded; sampled incoming traces always are
    # metrics: false                    # also export the Prometheus registry over OTLP

auth:
  # Anonymous read of private repos (via the "anonymous-read" permission target).
  # Repositories flagged public are always anonymously readable (read-only),
  # regardless of this setting.
  allowAnonymousRead: false
  legacyApiKeyEnabled: false  # default false; true accepts server.apiKey (deprecated, full admin)
  sessionDurationHours: 24
  # hmacKey: "CHANGE_ME"  # optional; unset = random key generated once, persisted in system_settings
  # samlSpCert: ""         # PEM SAML SP certificate; unset = self-signed pair generated once, persisted encrypted
  # samlSpKey: ""          # PEM SAML SP key; regenerating means re-registering the cert at the IdP

gpg:
  enabled: false
  # keyPath: /etc/openartifact/gpg/private.key
  # passphrase: ""
  # autoGenerate: false  # generate a global RSA-4096 signing key at startup when none exists; needs OPENARTIFACT_SECRET_KEY (keys can also be managed via the admin API / `oa gpg`)

# Signing key of SBOM / VEX attestations (GET .../download?attest=true, see
# docs/security/sbom.md). Unset: an ECDSA P-256 key is generated on first use
# and stored encrypted in the database (needs OPENARTIFACT_SECRET_KEY to be
# encrypted at rest). A key file is an unencrypted PKCS#8 / SEC1 PEM, ECDSA or
# Ed25519; env: ATTESTATION_KEY_PATH.
attestation:
  # keyPath: /etc/openartifact/attestation/key.pem

backup:
  backupDir: "/var/lib/openartifact/backups"
  # Lease of a running backup without a heartbeat; a crashed backup stops
  # holding blob deletions after this time. Must be positive.
  leaseTtl: 5m

# Bytes of deleted blobs are removed by a sweeper after the grace period and only
# when no running backup can still need them.
blobDeletion:
  grace: 24h         # 0 = no grace
  sweepInterval: 1m  # 0 = sweeper off on this replica
  sweepBatch: 200    # deletions claimed per pass

projects:
  # Let any authenticated user create a project and become its owner. Off: only global
  # admins create projects. A value saved by an admin in the UI takes precedence.
  selfCreate: false

ai:
  enabled: false
  autoAnalyze: false   # analyse every upload automatically; off = only on request (UI/API/MCP)
  provider: "openai"   # openai | azure | ollama | custom (custom needs baseUrl)
  # baseUrl: "https://api.openai.com/v1"
  # apiKey: "CHANGE_ME"
  model: "gpt-4o-mini"
  maxTokens: 1024
  timeoutSecs: 30
  # systemPrompt: ""  # leave empty to use built-in prompt

mcp:
  enabled: false
  transport: "http"   # only http is supported (stdio is rejected)
  httpPath: "/mcp"    # mount path; requires "Authorization: Bearer <TOKEN>"
  # allowedOrigins: ["https://agents.example.com"]  # browser origins accepted besides BASE_URL's; others get 403 (no Origin header = allowed)
  # maxBodyBytes: 1048576        # max size of one MCP request body (default 1 MiB)
  # rateLimitPerMinute: 600      # MCP requests per authenticated principal per minute (0 = unlimited)
  # aiTriggerPerMinute: 10       # trigger_ai_analysis calls per principal per minute (0 = unlimited)

workers:
  # Max metadata regenerations (npm, maven, deb, rpm together) running at once.
  # Each pins up to two database connections while it runs; keep it well below
  # database.maxOpenConns.
  metadataRegenConcurrency: 4
  # Docker registry garbage collection: deletes untagged manifests older than
  # dockerGcGracePeriod and the blobs only they referenced. dockerGcInterval is
  # the pause between passes over all docker repositories (0 disables the
  # schedule; an admin can still run it with POST
  # /api/v1/repositories/{name}/registry-gc). Digest-pinned references to an
  # untagged manifest stop working once it is collected, so keep the grace
  # period longer than your slowest push and the longest-lived digest pin.
  dockerGcInterval: 1h
  dockerGcGracePeriod: 24h
  # Docker proxy repositories: manifests and blobs addressed by digest are
  # evicted from the proxy cache after proxyDockerDigestTtl without a pull (a
  # pull in the second half of the period renews them) and fetched from the
  # upstream again on the next one. 0 keeps them until an admin purge or the
  # repository's removal.
  proxyDockerDigestTtl: 720h
  # Abandoned docker blob uploads idle longer than dockerUploadTtl are deleted
  # with their staged file (0 disables the sweeper). dockerUploadDir stages
  # in-progress uploads; it must hold your biggest layer.
  dockerUploadTtl: 24h
  dockerUploadDir: /tmp/openartifact/docker-uploads
  # Days finished (success/failed) webhook delivery records are kept before the
  # hourly purge deletes them (0 keeps them forever; pending ones are never
  # purged).
  webhookDeliveryRetentionDays: 30

# Audit log retention. Entries older than retentionDays are deleted by a
# background worker in paced batches of purgeBatchSize, one replica at a time,
# every purgeInterval. 0 (the default) keeps the audit log forever. Nothing is
# exported before deletion: archive with `oa audit export` first. See
# docs/operations/audit-retention.md.
audit:
  retentionDays: 0
  purgeInterval: 1h
  purgeBatchSize: 5000

# Trash (soft delete). Deleted artifacts, versions and repositories stay
# restorable for retentionDays before the purge worker removes them for good.
# A repository can override this with its own trash_retention_days; 0 (here or
# per repository) means deletes are immediate and permanent. Soft-deleted bytes
# keep counting against quotas until purged. purgeInterval is the pause between
# purge passes (0 disables the schedule; admins can still purge by hand).
# See docs/operations/trash.md.
trash:
  retentionDays: 7
  purgeInterval: 15m

# Documentation links in the web UI. baseUrl is the root of the published
# docs; the UI appends the version (vX.Y/ for releases, latest/ otherwise).
# Point it at a mirror for air-gapped installs; empty hides the links.
docs:
  baseUrl: https://openartifact.github.io/

# White-label branding of the web UI (docs/operations/branding.md). All keys
# are optional; administrators can override each of them at runtime in
# Administration > Branding, and a runtime value wins over this file.
# logoLight/logoDark/favicon are file paths to a PNG or SVG (max 512 KiB). The
# "Powered by OpenArtifact" attribution and the source-code link stay visible
# whatever you set (AGPL-3.0 section 13); sourceUrl is where that link points.
#branding:
#  productName: Acme Artifacts
#  logoLight: /etc/openartifact/brand/logo-light.svg
#  logoDark: /etc/openartifact/brand/logo-dark.svg
#  favicon: /etc/openartifact/brand/favicon.png
#  primaryColor: "#0f766e"          # #rrggbb; contrast-adjusted per theme
#  loginMessage: "Internal use only. Contact **IT** for access."
#  supportUrl: https://support.example.com   # http(s) or mailto:
#  sourceUrl: https://github.com/openartifact/openartifact

# Federated repositories: peer-to-peer replication of hosted repositories
# between instances. enabled is the master switch of the pull workers and of
# the /federation/v1 peer endpoints. See docs/operations/federation.md.
#federation:
#  enabled: false
#  pollInterval: 30s
#  batchSize: 200
#  maxBackoff: 15m
#  requestTimeout: 30s
#  tombstoneRetention: 720h

# Storage tiers and lifecycle policies. Tiers (named storage backends) and the
# policies that move blobs between them are managed in the admin UI/API; this
# section only tunes the background mover. With only the primary store
# configured it has no effect. See docs/operations/storage-tiering.md.
tiering:
  enabled: true               # run the mover (reads work from every tier regardless)
  interval: 5m                # pause between passes; 0 disables the schedule
  batch: 200                  # most blobs one pass moves
  concurrency: 2              # blobs copied at once
  maxBytesPerSecond: 67108864 # total copy bandwidth cap (0 = unlimited)
  verifyReadback: true        # re-hash each copy on the target tier before flipping
  accessFlushInterval: 30s    # how often recorded downloads are written to the database
  refreshInterval: 30s        # how often each replica reloads the tier list

# Disaster-recovery row journal: package metadata (repository names, paths,
# dist-tags, trash state, ...) is mirrored as small sidecar blobs in the blob
# store so `openartifact rebuild` can re-index an empty database from storage.
# See docs/operations/rebuild-from-storage.md.
recovery:
  journal:
    enabled: true             # capture changes (database triggers) and write the sidecars
    interval: 10s             # pause between worker passes draining the changed-row queue
    batch: 200                # rows claimed per drain step
    concurrency: 4            # sidecar blobs written or deleted at once
    reconcileInterval: 24h    # re-check every table for missing/stale sidecars (backfill); 0 = only the first complete pass

# Trivy and grype vulnerability scanners (the "trivy" / "grype" scanner names of
# POST .../vuln/scan). They are separate binaries: install them on PATH, set a
# path below, or build the image with SCANNERS=trivy|grype|all. The server keeps
# their vulnerability databases in cacheDir, downloading them in the background;
# scans never download. See docs/security/scanning.md.
scanners:
  cacheDir: ""             # absolute; default <user cache dir>/openartifact/scanners (the image sets /var/cache/openartifact/scanners)
  updateInterval: 6h       # database refresh interval, at least 1h; 0 downloads once and stops
  offline: false           # never download; the databases must already be in cacheDir
  downloadBaseUrl: https://github.com  # https origin of the pinned release archives (install: auto); a mirror must serve GitHub's /<owner>/<repo>/releases/download/<tag>/<file> paths
  trivy:
    path: ""               # command name or absolute path; default "trivy" on PATH
    install: none          # none | auto: download the pinned, sha256-verified release into <cacheDir>/bin when path is empty and trivy is not on PATH
    dbRepository: ""       # OCI repository to download trivy-db from (a mirror); default Trivy's built-in list
    javaDbRepository: ""   # also download the Java index database from this repository; empty skips it
  grype:
    path: ""               # command name or absolute path; default "grype" on PATH
    install: none          # none | auto: as for trivy
    dbUrl: ""              # http(s) URL of a grype database listing.json (a mirror), no credentials in the URL; default grype's built-in
