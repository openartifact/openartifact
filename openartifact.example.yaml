# OpenArtifact configuration file
# All values here can be overridden by environment variables.
# Validate with: openartifact verify openartifact.yaml
# Start with:    openartifact -config openartifact.yaml (or OPENARTIFACT_CONFIG=...)

server:
  host: "0.0.0.0"
  port: 8080
  # 0 (default) = unlimited so large uploads are never truncated
  # readTimeout: 0       # seconds
  # writeTimeout: 0      # seconds
  shutdownTimeout: 30  # seconds
  # tlsEnabled: false
  # tlsCert: /etc/openartifact/tls/cert.pem
  # tlsKey: /etc/openartifact/tls/key.pem
  # Replace with the trusted browser origin.
  corsOrigins:
    - "https://app.example.com"
  # ipAllowlist:
  #   - "10.0.0.0/8"
  #   - "192.168.0.0/16"
  # rateLimitRps: 100
  # pprofEnabled: false     # Go profiler at /api/v1/admin/pprof/ (admin only); env OPENARTIFACT_PPROF_ENABLED
  # readHeaderTimeout: 10   # seconds
  # maxBodyBytes: 17179869184  # max request body for every endpoint (16 GiB); 0 = unlimited
  # trustedProxies:         # CIDRs whose X-Forwarded-For is trusted
  #   - "10.0.0.0/8"
  # apiKey: ""              # legacy write API key
  # instanceId: "node-1"

baseUrl: "http://localhost:8080"

database:
  driver: "postgres"
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "CHANGE_ME"
  database: "artifact_repo"
  # "require" by default; use "disable" only for local development without TLS.
  sslMode: "require"
  # Extra libpq connection parameters (env: DB_OPTIONS=key=value,key=value).
  # options:
  #   connect_timeout: "5"
  maxOpenConns: 25
  maxIdleConns: 5
  connMaxLifetimeMinutes: 30
  # How long startup keeps retrying the initial database connection (capped
  # exponential backoff) before exiting; 0 fails immediately
  # (env: DB_CONNECT_TIMEOUT, e.g. 60s).
  connectTimeout: 60s
  # In-memory cache for per-request auth lookups (token, user, groups,
  # permission targets, repository by name). Changes made through this
  # instance take effect immediately; other replicas see them after at most
  # this many milliseconds. 0 disables the cache.
  authCacheTtlMs: 2000

storage:
  # type: filesystem | s3 | gcs | azure | garage | seaweedfs | oci
  type: "filesystem"
  # Free-form backend options (env: STORAGE_OPTIONS=key=value,key=value).
  # options: {}
  path: "/var/lib/artifacts"
  # S3 / S3-compatible:
  # type: s3
  # bucket: openartifact
  # region: us-east-1
  # accessKey: CHANGE_ME
  # secretKey: CHANGE_ME
  # endpoint: http://garage:3900
  # forcePathStyle: true
  # presignTtl: 5m
  # Direct downloads via presigned URLs (s3 / gcs only; off by default):
  # presignDownloads: true
  # presignMinSize: 1048576      # bytes; smaller blobs are streamed, 0 = redirect all
  # presignEndpoint: https://s3.example.com   # public URL for signing only, when endpoint is internal
  # presignUploadTtl: 30m        # clamped to 1m..12h
  # presignMaxPendingUploads: 20 # outstanding presigned uploads per user, 0 = unlimited
  # GCS (S3-compatible XML API):
  # gcsBucket: my-bucket
  # gcsHmacKey: CHANGE_ME
  # gcsHmacSecret: CHANGE_ME
  # Azure Blob:
  # azureAccountName: myaccount
  # azureAccountKey: CHANGE_ME
  # azureContainerName: artifacts
  # OCI registry:
  # ociUsername: user
  # ociPassword: CHANGE_ME
  # ociInsecure: false

log:
  level: "info"    # debug | info | warn | error
  format: "json"   # json | text
  output: "stdout"

auth:
  # Anonymous read of private repos (via the "anonymous-read" permission target).
  # Repositories flagged public are always anonymously readable (read-only),
  # regardless of this setting.
  allowAnonymousRead: false
  legacyApiKeyEnabled: true  # default true; set false to disable the legacy API key
  sessionDurationHours: 24
  # hmacKey: "CHANGE_ME"  # REQUIRED for restart/replica-safe SSO; random per boot if unset
  # samlSpCert: ""         # PEM, persistent SAML SP certificate
  # samlSpKey: ""          # PEM, persistent SAML SP key

gpg:
  enabled: false
  # keyPath: /etc/openartifact/gpg/private.key
  # passphrase: ""
  # autoGenerate: false

backup:
  backupDir: "/var/lib/openartifact/backups"

projects:
  # Let any authenticated user create a project and become its owner. Off: only global
  # admins create projects. A value saved by an admin in the UI takes precedence.
  selfCreate: false

ai:
  enabled: false
  autoAnalyze: false   # analyse every upload automatically; off = only on request (UI/API/MCP)
  provider: "openai"   # openai | azure | ollama | custom (custom needs baseUrl)
  # baseUrl: "https://api.openai.com/v1"
  # apiKey: "CHANGE_ME"
  model: "gpt-4o-mini"
  maxTokens: 1024
  timeoutSecs: 30
  # systemPrompt: ""  # leave empty to use built-in prompt

mcp:
  enabled: false
  transport: "http"   # only http is supported (stdio is rejected)
  httpPath: "/mcp"    # mount path; requires "Authorization: Bearer <TOKEN>"

workers:
  # Max metadata regenerations (npm, maven, deb, rpm together) running at once.
  # Each pins up to two database connections while it runs; keep it well below
  # database.maxOpenConns.
  metadataRegenConcurrency: 4
  # Docker registry garbage collection: deletes untagged manifests older than
  # dockerGcGracePeriod and the blobs only they referenced. dockerGcInterval is
  # the pause between passes over all docker repositories (0 disables the
  # schedule; an admin can still run it with POST
  # /api/v1/repositories/{name}/registry-gc). Digest-pinned references to an
  # untagged manifest stop working once it is collected, so keep the grace
  # period longer than your slowest push and the longest-lived digest pin.
  dockerGcInterval: 1h
  dockerGcGracePeriod: 24h
  # Abandoned docker blob uploads idle longer than dockerUploadTtl are deleted
  # with their staged file (0 disables the sweeper). dockerUploadDir stages
  # in-progress uploads; it must hold your biggest layer.
  dockerUploadTtl: 24h
  dockerUploadDir: /tmp/openartifact/docker-uploads
  # Days finished (success/failed) webhook delivery records are kept before the
  # hourly purge deletes them (0 keeps them forever; pending ones are never
  # purged).
  webhookDeliveryRetentionDays: 30

# Trash (soft delete). Deleted artifacts, versions and repositories stay
# restorable for retentionDays before the purge worker removes them for good.
# A repository can override this with its own trash_retention_days; 0 (here or
# per repository) means deletes are immediate and permanent. Soft-deleted bytes
# keep counting against quotas until purged. purgeInterval is the pause between
# purge passes (0 disables the schedule; admins can still purge by hand).
# See docs/operations/trash.md.
trash:
  retentionDays: 7
  purgeInterval: 15m
