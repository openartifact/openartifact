# Temporary: times .clusterfuzzlite/build.sh on a hosted runner. Removed before merge.
name: zz fuzz build bench

on:
  pull_request:
    paths:
      - ".github/workflows/zz-fuzz-build-bench.yml"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Runner
        run: |
          nproc; free -m; df -h .; grep -m1 'model name' /proc/cpuinfo

      - name: Build image
        run: docker build -f .clusterfuzzlite/Dockerfile -t oa-cfl .

      - name: Old build.sh (serial)
        run: |
          git show origin/main:.clusterfuzzlite/build.sh > "$RUNNER_TEMP/old-build.sh"
          chmod +x "$RUNNER_TEMP/old-build.sh"
          .github/zz-bench.sh old "$RUNNER_TEMP/old-build.sh" 1

      - name: New build.sh, 1 job
        run: .github/zz-bench.sh new1 "" 1

      - name: New build.sh, 4 jobs
        run: .github/zz-bench.sh new4 "" 4
