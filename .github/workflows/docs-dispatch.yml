# The docs site (https://openartifact.github.io/) is built from this repository's
# docs/ by openartifact/openartifact.github.io. Tell it to rebuild when docs
# change on main and when a release is tagged. Needs the repository secret
# SITE_DISPATCH_TOKEN: a fine-grained token limited to openartifact.github.io with
# Actions: write and Contents: read. Without it the step is skipped and the
# site's daily schedule picks the change up.
name: Docs site dispatch

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "web/src/lib/installCommands.ts"
      - ".github/workflows/docs-dispatch.yml"
    tags: ["v*.*.*"]

permissions: {}

jobs:
  dispatch:
    name: rebuild openartifact.github.io
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch docs-updated
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; the site rebuilds on its daily schedule"
            exit 0
          fi
          gh api repos/openartifact/openartifact.github.io/dispatches -f event_type=docs-updated
