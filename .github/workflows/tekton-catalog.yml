name: Tekton catalog

on:
  pull_request:
    paths:
      - "integrations/tekton/**"
      - "docker/Dockerfile.oa-tekton"
      - ".github/workflows/tekton-catalog.yml"
      - "scripts/smoke/oci-supplychain.sh"
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish the catalog for (e.g. v0.20.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: tekton-catalog-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}-tekton
  CATALOG: ghcr.io/${{ github.repository_owner }}/tekton-catalog
  REF: ${{ inputs.tag || github.ref_name }}
  TKN_VERSION: "0.46.2"
  TKN_SHA256: f6d86bc7960d85af94eb46f8f480ac8d113aa78e78b15d6f8d2f53d80daab2ce

jobs:
  lint:
    name: Validate catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: YAML parses and carries an SPDX header
        run: |
          for f in integrations/tekton/*/*.yaml; do
            yq e '.' "$f" >/dev/null
            grep -q "SPDX-License-""Identifier: AGPL-3.0-or-later" "$f" || { echo "::error file=$f::missing SPDX header"; exit 1; }
          done
      - name: Shell scripts
        run: shellcheck -x scripts/smoke/oci-supplychain.sh

  publish:
    name: Publish image and catalog bundles
    if: github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push the image and the bundles to GHCR
      id-token: write # keyless cosign signing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - name: Version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ steps.version.outputs.version }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: docker/Dockerfile.oa-tekton
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          provenance: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Install tkn
        run: |
          curl -fsSL -o tkn.tgz "https://github.com/tektoncd/cli/releases/download/v${TKN_VERSION}/tkn_${TKN_VERSION}_Linux_x86_64.tar.gz"
          echo "${TKN_SHA256}  tkn.tgz" | sha256sum -c -
          tar -xzf tkn.tgz tkn
          sudo install tkn /usr/local/bin/tkn
      - name: Push and sign one bundle per catalog resource
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The bundles resolver reads one resource per bundle (kind and name come from the resource).
          for f in integrations/tekton/stepactions/*.yaml integrations/tekton/tasks/*.yaml integrations/tekton/pipelines/*.yaml; do
            kind="$(yq e '.kind' "$f" | tr '[:upper:]' '[:lower:]')"
            name="$(yq e '.metadata.name' "$f")"
            ref="${CATALOG}/${kind}-${name}"
            out="$(tkn bundle push "${ref}:${VERSION}" -f "$f")"
            echo "$out"
            digest="$(echo "$out" | grep -o 'sha256:[0-9a-f]\{64\}' | tail -n1)"
            [ -n "$digest" ] || { echo "::error::no digest for $ref"; exit 1; }
            cosign sign --yes "${ref}@${digest}"
            echo "${ref}@${digest}" >> bundles.txt
          done
          {
            echo "### Tekton catalog ${VERSION}"
            while read -r line; do printf -- '- %s\n' "$line"; done < bundles.txt
          } >> "$GITHUB_STEP_SUMMARY"
