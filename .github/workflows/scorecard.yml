name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 4 * * 2" # weekly, Tuesday 04:17 UTC
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the OpenSSF API (publish_results)
      actions: read # Scorecard reads workflow metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
          category: scorecard
