# Daily fuzzing of main, in this order: batch fuzzing (grows the corpus), corpus
# pruning, coverage report. The corpus and the coverage report live in the
# openartifact/openartifact-fuzz-storage repository (branches main and gh-pages),
# which pull-request fuzzing reads to start from the corpus and to run only the
# fuzz targets a change affects. FUZZ_STORAGE_TOKEN is a fine-grained personal
# access token with Contents: read and write on that repository only (the
# workflow token cannot write to another repository).
# Pull-request fuzzing: clusterfuzzlite-pr.yml. Local runs and storage
# setup: docs/development/README.md.
name: ClusterFuzzLite batch

on:
  schedule:
    - cron: "41 2 * * *" # daily, 02:41 UTC
  workflow_dispatch:

# Every job writes to the storage repository: never run two of them at once
# (a dispatch during a scheduled run waits instead of pruning under the batch).
concurrency:
  group: clusterfuzzlite-storage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  batch:
    name: batch fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read # find the previous crash artifacts
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Require the storage token
        env:
          FUZZ_STORAGE_TOKEN: ${{ secrets.FUZZ_STORAGE_TOKEN }}
        run: |
          if [ -z "$FUZZ_STORAGE_TOKEN" ]; then
            echo "::error::secret FUZZ_STORAGE_TOKEN is not set (docs/development/README.md#fuzzing)"
            exit 1
          fi

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 3600
          mode: batch
          sanitizer: address
          output-sarif: true
          parallel-fuzzing: true
          storage-repo: https://x-access-token:${{ secrets.FUZZ_STORAGE_TOKEN }}@github.com/openartifact/openartifact-fuzz-storage.git
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages

      - name: Upload SARIF
        if: ${{ !cancelled() && hashFiles('cifuzz-sarif/results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: cifuzz-sarif/results.sarif
          category: clusterfuzzlite

  prune:
    name: corpus pruning
    needs: batch
    if: ${{ !cancelled() }} # a crash found by the batch run must not skip pruning
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the storage token
        env:
          FUZZ_STORAGE_TOKEN: ${{ secrets.FUZZ_STORAGE_TOKEN }}
        run: |
          if [ -z "$FUZZ_STORAGE_TOKEN" ]; then
            echo "::error::secret FUZZ_STORAGE_TOKEN is not set (docs/development/README.md#fuzzing)"
            exit 1
          fi

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune corpus
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 1200
          mode: prune
          sanitizer: address
          storage-repo: https://x-access-token:${{ secrets.FUZZ_STORAGE_TOKEN }}@github.com/openartifact/openartifact-fuzz-storage.git
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages

  coverage:
    name: coverage report
    needs: prune
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the storage token
        env:
          FUZZ_STORAGE_TOKEN: ${{ secrets.FUZZ_STORAGE_TOKEN }}
        run: |
          if [ -z "$FUZZ_STORAGE_TOKEN" ]; then
            echo "::error::secret FUZZ_STORAGE_TOKEN is not set (docs/development/README.md#fuzzing)"
            exit 1
          fi

      - name: Build fuzzers (coverage)
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate coverage report
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: coverage
          sanitizer: coverage
          storage-repo: https://x-access-token:${{ secrets.FUZZ_STORAGE_TOKEN }}@github.com/openartifact/openartifact-fuzz-storage.git
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages
