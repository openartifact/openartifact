# Daily fuzzing of main, in this order: batch fuzzing (grows the corpus), corpus
# pruning, coverage report. The corpus and the coverage report live in the
# openartifact/openartifact-fuzz-storage repository (branches main and gh-pages),
# which pull-request fuzzing reads to start from the corpus and to run only the
# fuzz targets a change affects. FUZZ_STORAGE_TOKEN is a fine-grained personal
# access token with Contents: read and write on that repository only (the
# workflow token cannot write to another repository).
# Pull-request fuzzing: clusterfuzzlite-pr.yml. Local runs and storage
# setup: docs/development/README.md.
name: ClusterFuzzLite batch

on:
  schedule:
    - cron: "41 2 * * *" # daily, 02:41 UTC
  workflow_dispatch:

# Every job writes to the storage repository: never run two of them at once
# (a dispatch during a scheduled run waits instead of pruning under the batch).
concurrency:
  group: clusterfuzzlite-storage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  batch:
    name: batch fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read # find the previous crash artifacts
      security-events: write # upload SARIF to code scanning
    steps:
      # ClusterFuzzLite only logs a failed upload and carries on, so a token
      # GitHub rejects would cost the whole run before anyone notices.
      - name: Check the storage token
        env:
          FUZZ_STORAGE_TOKEN: ${{ secrets.FUZZ_STORAGE_TOKEN }}
        run: |
          fail() { echo "::error::FUZZ_STORAGE_TOKEN $1 (docs/development/README.md#fuzzing)"; exit 1; }
          [ -n "$FUZZ_STORAGE_TOKEN" ] || fail "is not set"
          [ "$FUZZ_STORAGE_TOKEN" = "${FUZZ_STORAGE_TOKEN//[[:space:]]/}" ] ||
            fail "holds whitespace or a newline: set it with printf %s"
          code="$(curl -sS -o repo.json -w '%{http_code}' \
            -H "Authorization: Bearer $FUZZ_STORAGE_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/openartifact/openartifact-fuzz-storage)"
          [ "$code" = 200 ] || fail "is rejected by GitHub (HTTP $code): expired, revoked or not granted to openartifact-fuzz-storage"
          jq -e '.permissions.push == true' repo.json > /dev/null ||
            fail "cannot push to openartifact-fuzz-storage: it needs Contents: read and write"
          rm -f repo.json

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 3600
          mode: batch
          sanitizer: address
          output-sarif: true
          parallel-fuzzing: true
          storage-repo: https://x-access-token:${{ secrets.FUZZ_STORAGE_TOKEN }}@github.com/openartifact/openartifact-fuzz-storage.git
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages

      - name: Upload SARIF
        if: ${{ !cancelled() && hashFiles('cifuzz-sarif/results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: cifuzz-sarif/results.sarif
          category: clusterfuzzlite

  prune:
    name: corpus pruning
    needs: batch
    if: ${{ !cancelled() }} # a crash found by the batch run must not skip pruning
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      # ClusterFuzzLite only logs a failed upload and carries on, so a token
      # GitHub rejects would cost the whole run before anyone notices.
      - name: Check the storage token
        env:
          FUZZ_STORAGE_TOKEN: ${{ secrets.FUZZ_STORAGE_TOKEN }}
        run: |
          fail() { echo "::error::FUZZ_STORAGE_TOKEN $1 (docs/development/README.md#fuzzing)"; exit 1; }
          [ -n "$FUZZ_STORAGE_TOKEN" ] || fail "is not set"
          [ "$FUZZ_STORAGE_TOKEN" = "${FUZZ_STORAGE_TOKEN//[[:space:]]/}" ] ||
            fail "holds whitespace or a newline: set it with printf %s"
          code="$(curl -sS -o repo.json -w '%{http_code}' \
            -H "Authorization: Bearer $FUZZ_STORAGE_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/openartifact/openartifact-fuzz-storage)"
          [ "$code" = 200 ] || fail "is rejected by GitHub (HTTP $code): expired, revoked or not granted to openartifact-fuzz-storage"
          jq -e '.permissions.push == true' repo.json > /dev/null ||
            fail "cannot push to openartifact-fuzz-storage: it needs Contents: read and write"
          rm -f repo.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fuzz budget
        id: budget
        run: |
          targets=$(grep -rh --include='*_test.go' '^func Fuzz' . | wc -l)
          seconds=$((targets * 30))
          [ "$seconds" -ge 3600 ] || seconds=3600
          echo "$targets fuzz targets, budget $seconds s"
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune corpus
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Not a run time: it is split among the targets (minus the time each
          # one took) and caps the merge of one target's corpus. The budget is
          # 30 s per target, counted by the "Fuzz budget" step (202 targets:
          # 6060 s); a flat 1200 s once left ~11 s per target and the merge of
          # internal_format_conan_FuzzGlobRegexp timed out and failed the job.
          fuzz-seconds: ${{ steps.budget.outputs.seconds }}
          mode: prune
          sanitizer: address
          storage-repo: https://x-access-token:${{ secrets.FUZZ_STORAGE_TOKEN }}@github.com/openartifact/openartifact-fuzz-storage.git
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages

  coverage:
    name: coverage report
    needs: prune
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      # ClusterFuzzLite only logs a failed upload and carries on, so a token
      # GitHub rejects would cost the whole run before anyone notices.
      - name: Check the storage token
        env:
          FUZZ_STORAGE_TOKEN: ${{ secrets.FUZZ_STORAGE_TOKEN }}
        run: |
          fail() { echo "::error::FUZZ_STORAGE_TOKEN $1 (docs/development/README.md#fuzzing)"; exit 1; }
          [ -n "$FUZZ_STORAGE_TOKEN" ] || fail "is not set"
          [ "$FUZZ_STORAGE_TOKEN" = "${FUZZ_STORAGE_TOKEN//[[:space:]]/}" ] ||
            fail "holds whitespace or a newline: set it with printf %s"
          code="$(curl -sS -o repo.json -w '%{http_code}' \
            -H "Authorization: Bearer $FUZZ_STORAGE_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/openartifact/openartifact-fuzz-storage)"
          [ "$code" = 200 ] || fail "is rejected by GitHub (HTTP $code): expired, revoked or not granted to openartifact-fuzz-storage"
          jq -e '.permissions.push == true' repo.json > /dev/null ||
            fail "cannot push to openartifact-fuzz-storage: it needs Contents: read and write"
          rm -f repo.json

      - name: Build fuzzers (coverage)
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate coverage report
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: coverage
          sanitizer: coverage
          storage-repo: https://x-access-token:${{ secrets.FUZZ_STORAGE_TOKEN }}@github.com/openartifact/openartifact-fuzz-storage.git
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages
