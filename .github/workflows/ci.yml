name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Pushes to main run to completion: the coverage job there stores the baseline
  # pull requests compare against, and a cancelled run saves nothing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"
  # Dependabot does not track the version inputs below (bun-version,
  # golangci-lint version, Trivy binary version used by trivy-action); bump
  # them by hand (TRIVY_VERSION also in release.yml and scheduled-scan.yml).
  # sqlc, govulncheck, deadcode and actionlint live in tools/go.mod and are bumped by
  # Dependabot (gomod, /tools).
  BUN_VERSION: "1.4.4"
  GOLANGCI_LINT_VERSION: "v2.15.0"
  TRIVY_VERSION: "v0.76.1"
  IMAGE_TAG: openartifact:ci

jobs:
  go:
    name: build / vet / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go mod tidy (verify no drift)
        run: |
          go mod tidy -diff
          cd tools && go mod tidy -diff

      - name: govulncheck
        run: go tool -modfile=tools/go.mod govulncheck ./...

      - name: deadcode (no unreachable Go code)
        run: scripts/deadcode-check.sh

      - name: duplication ratchet (dupl)
        run: scripts/dup-check.sh

      # -coverpkg=./... attributes coverage to every package, not just the one a
      # test lives in; the coverage job merges this with the integration profile.
      - name: go test (race, unit packages)
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage-unit.out -timeout 10m ./...

      - name: upload unit coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go-unit
          path: coverage-unit.out
          retention-days: 14

  integration:
    name: integration (postgres + garage + testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/openartifact_test?sslmode=disable
      TEST_S3_ENDPOINT: http://localhost:3900
      TEST_S3_BUCKET: openartifact-test
      TEST_S3_REGION: garage
      # Throwaway credentials imported into the ephemeral Garage node below.
      TEST_S3_ACCESS_KEY: GK0123456789abcdef01234567
      TEST_S3_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    services:
      postgres:
        image: docker.io/postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openartifact_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # Integration packages run in parallel, each with its own pools; the default
      # 100 connections runs out. Service containers take no command line, so set
      # it with ALTER SYSTEM and restart.
      - name: raise Postgres max_connections
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" psql -U postgres -c "ALTER SYSTEM SET max_connections = 500"
          docker restart "$PG_CONTAINER"
          for _ in $(seq 1 30); do docker exec "$PG_CONTAINER" pg_isready -U postgres && break; sleep 1; done
          docker exec "$PG_CONTAINER" psql -U postgres -Atc "SHOW max_connections"

      # MinIO no longer publishes container images; Garage is the S3 test backend.
      - name: start Garage
        run: |
          cat > /tmp/garage.toml <<EOF
          metadata_dir = "/var/lib/garage/meta"
          data_dir = "/var/lib/garage/data"
          db_engine = "sqlite"
          replication_factor = 1
          rpc_bind_addr = "[::]:3901"
          rpc_public_addr = "127.0.0.1:3901"
          rpc_secret = "$(openssl rand -hex 32)"
          [s3_api]
          s3_region = "garage"
          api_bind_addr = "[::]:3900"
          root_domain = ".s3.garage.localhost"
          [admin]
          api_bind_addr = "[::]:3903"
          EOF
          docker run -d --name garage -p 3900:3900 \
            -v /tmp/garage.toml:/etc/garage.toml \
            docker.io/dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
          G="docker exec garage /garage"
          for _ in $(seq 1 30); do $G status >/dev/null 2>&1 && break; sleep 1; done
          NODE=$($G node id -q | cut -d@ -f1)
          $G layout assign -z dc1 -c 1G "$NODE"
          $G layout apply --version 1
          $G bucket create "$TEST_S3_BUCKET"
          $G key import --yes -n ci "$TEST_S3_ACCESS_KEY" "$TEST_S3_SECRET_KEY"
          $G bucket allow --read --write --owner "$TEST_S3_BUCKET" --key ci

      - name: go test (integration tag, race)
        # Every package with an integration-tagged test file, so a new one can't be missed.
        run: |
          pkgs=$(grep -rl --include='*_test.go' -E '^//go:build .*integration' cmd internal pkg tests \
            | xargs -n1 dirname | sort -u | sed 's#^#./#')
          echo "$pkgs"
          # shellcheck disable=SC2086
          go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage-integration.out \
            -tags integration -count=1 -timeout 25m $pkgs

      - name: upload integration coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go-integration
          path: coverage-integration.out
          retention-days: 14

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # Runs the linters plus the gofmt/goimports/golines formatters (unformatted code fails the job) from .golangci.yaml.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --config=.golangci.yaml

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  sqlc:
    name: sqlc generate (verify no drift)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Run sqlc generate
        run: go tool -modfile=tools/go.mod sqlc generate

      - name: Fail if generated code is out of date
        run: |
          if ! git diff --quiet -- internal/database/dbsqlc; then
            echo "::error::sqlc generate produced a diff — run 'make generate' locally and commit internal/database/dbsqlc/"
            git diff --stat -- internal/database/dbsqlc
            exit 1
          fi

      - name: Web format constants are up to date (cmd/genformats)
        run: go run ./cmd/genformats -check

  web:
    name: web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run typecheck

      - name: generated API client is up to date
        run: |
          bun run generate-api
          git diff --exit-code -- src/api/generated

      - name: translation catalogs are consistent
        run: bun run i18n:check

      - name: duplication threshold (jscpd)
        run: bun run dup

      - name: bun test (with coverage)
        run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage

      - name: upload web coverage (lcov)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: web/coverage/lcov.info
          retention-days: 14

      - run: bun run build
      - run: bun run web/scripts/check-bundle-size.js
        working-directory: .

  # Merges the unit and integration Go profiles, reports totals and per-area
  # numbers (job summary, HTML artifact) and compares them with the latest run
  # on main. A total that drops by more than 1 point fails the job; see
  # docs/development/testing.md. Fork pull requests get the same report: the
  # sticky comment is posted by coverage-comment.yml (workflow_run) because a
  # fork token cannot write.
  coverage:
    name: coverage report
    needs: [go, integration, web]
    if: ${{ !cancelled() && needs.go.result == 'success' && needs.integration.result == 'success' && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: cov/in

      - name: merge and summarize
        run: |
          scripts/coverage/merge-go.sh cov/unit.out cov/in/coverage-go-unit/coverage-unit.out
          scripts/coverage/merge-go.sh cov/integration.out cov/in/coverage-go-integration/coverage-integration.out
          scripts/coverage/merge-go.sh cov/merged.out cov/in/coverage-go-unit/coverage-unit.out cov/in/coverage-go-integration/coverage-integration.out
          scripts/coverage/summarize.sh --out cov/report \
            --go-merged cov/merged.out --go-unit cov/unit.out --go-integration cov/integration.out \
            --web-lcov cov/in/coverage-web/lcov.info

      # Pull requests compare against the numbers main stored on its last run.
      # Restoring a cache is allowed for fork pull requests; only main saves one.
      # Restore and save must use the same path: the path is part of the cache
      # version, so a different one never matches even with restore-keys.
      - name: restore baseline from main
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cov/baseline
          key: coverage-base-none
          restore-keys: coverage-base-

      - name: report
        run: |
          base=cov/baseline/coverage.json
          [ -s "$base" ] && cp "$base" cov/report/base.json
          scripts/coverage/render.sh cov/report/coverage.json "$base" | tee cov/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          cp cov/merged.out cov/report/go-merged.out

      - name: upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: cov/report
          retention-days: 30

      - name: store baseline for pull requests
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: mkdir -p cov/baseline && cp cov/report/coverage.json cov/baseline/coverage.json

      - name: save baseline cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cov/baseline
          key: coverage-base-${{ github.sha }}

      - name: coverage gate (total must not drop more than 1 point vs main)
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/coverage/gate.sh cov/report/coverage.json cov/baseline/coverage.json

  security:
    name: security (trivy image + repo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    env:
      # Fork PRs and Dependabot runs get a read-only token: scan and gate, skip the upload.
      CAN_UPLOAD_SARIF: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Fork PRs cannot read secrets: they build on the anonymous distroless base.
      - name: Select runtime base
        id: runtime
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
        run: |
          if [ -n "$DHI_USERNAME" ]; then
            echo "runtime=dhi" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=distroless" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to dhi.io
        if: ${{ steps.runtime.outputs.runtime == 'dhi' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Build image (loaded into the local daemon)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          provenance: false
          sbom: false
          build-args: RUNTIME=${{ steps.runtime.outputs.runtime }}
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=security
          cache-to: type=gha,scope=security,mode=max

      - name: Report image and binary sizes
        run: |
          {
            echo "### Image size (linux/amd64)"
            echo
            echo "- uncompressed: $(docker image inspect --format '{{.Size}}' "$IMAGE_TAG" | numfmt --to=iec --format=%.1f)"
            echo "- docker save | gzip -9: $(docker save "$IMAGE_TAG" | gzip -9 | wc -c | numfmt --to=iec --format=%.1f)"
          } >> "$GITHUB_STEP_SUMMARY"
          cid="$(docker create "$IMAGE_TAG")"
          trap 'docker rm "$cid" >/dev/null' EXIT
          for f in /app/openartifact /usr/local/bin/oa; do
            docker cp "$cid:$f" "$RUNNER_TEMP/size-probe"
            echo "- $f: $(stat -c %s "$RUNNER_TEMP/size-probe" | numfmt --to=iec --format=%.1f)" >> "$GITHUB_STEP_SUMMARY"
          done

      # --- image ---------------------------------------------------------
      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE_TAG }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - name: Upload image SARIF
        if: ${{ !cancelled() && env.CAN_UPLOAD_SARIF == 'true' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy image gate (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE_TAG }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      # --- repository: vulns in go.mod / bun.lock, secrets ---------------
      - name: Trivy fs scan (SARIF)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      - name: Upload fs SARIF
        if: ${{ !cancelled() && env.CAN_UPLOAD_SARIF == 'true' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Trivy fs gate
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: "1"

      # --- repository: misconfiguration (Dockerfile, compose, k8s) -------
      - name: Trivy config scan (SARIF)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"

      - name: Upload config SARIF
        if: ${{ !cancelled() && env.CAN_UPLOAD_SARIF == 'true' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Trivy config gate
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: "1"

  workflow-lint:
    name: workflow lint (actionlint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: tools/go.sum

      - name: actionlint
        run: go tool -modfile=tools/go.mod actionlint -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true

  docs:
    name: docs (generated reference + site build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # docs/reference is generated from the code (config keys, metrics, CLI, OpenAPI);
      # the same run checks .env.example and openartifact.example.yaml list every config key.
      - name: Generated reference is up to date
        run: go run ./cmd/docgen -check

      # The site (VitePress theme, navigation, landing page) lives in its own repository
      # and renders this checkout's docs/. A dead internal link fails the build.
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openartifact/openartifact.github.io
          path: site
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build docs (dead links fail the build)
        working-directory: site
        env:
          OA_TARGET: docs
          OA_SRC_DIR: ${{ github.workspace }}
          OA_OUT_DIR: ${{ runner.temp }}/docs-site
        run: bun run build:docs

  dependency-review:
    name: dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
