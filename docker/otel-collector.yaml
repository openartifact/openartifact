# Baseline otelcol-contrib configuration for a local Collector next to
# OpenArtifact (compose profile "otel-collector", a sidecar, or the same host).
# Only the Collector needs egress. Batching, retries and queueing happen here,
# not in the server.
#
#   OTELCOL_LISTEN_HOST           address the OTLP receivers bind to; unset
#                                 means localhost (set but empty binds every
#                                 interface); the compose profile sets 0.0.0.0
#   OTELCOL_EXPORT_ENDPOINT       OTLP/HTTP base URL of the backend (required:
#                                 without it the Collector exits with "at least
#                                 one endpoint must be specified"),
#                                 e.g. https://otlp.example.com
#   OTELCOL_EXPORT_AUTHORIZATION  Authorization header value sent to it,
#                                 e.g. "Bearer <token>"; an empty value is sent
#                                 as an empty header, so for a backend without
#                                 auth remove the headers block below
#
# See docs/operations/monitoring.md#local-collector.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTELCOL_LISTEN_HOST:-localhost}:4317
      http:
        endpoint: ${env:OTELCOL_LISTEN_HOST:-localhost}:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}
  # Masks what the browser can put into error events and spans: URLs, and
  # query strings in messages and stack traces (docs/operations/monitoring.md,
  # "Frontend telemetry"). It applies to the server's own traces and logs too.
  redaction/frontend:
    allow_all_keys: true
    blocked_key_patterns:
      - '^url\.(full|path|query)$'
      - '^browser\.document\.url\.'
    blocked_values:
      - '[?&][^=&\s]+=[^&\s)]*'
    summary: silent

exporters:
  otlp_http:
    endpoint: ${env:OTELCOL_EXPORT_ENDPOINT}
    headers:
      authorization: ${env:OTELCOL_EXPORT_AUTHORIZATION}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction/frontend, batch]
      exporters: [otlp_http]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction/frontend, batch]
      exporters: [otlp_http]
