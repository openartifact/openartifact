<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Installable PWA: the manifest, theme colours (surface of each theme) and the iOS home-screen metadata. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111420" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OpenArtifact" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>OpenArtifact</title>
    <script>
      // FOUC guard: apply theme before Vue mounts.
      (function () {
        try {
          var raw = localStorage.getItem('oa.theme')
          var mode = raw ? JSON.parse(raw) : 'auto'
          if (mode !== 'light' && mode !== 'dark') mode = 'auto'
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = mode === 'dark' || (mode === 'auto' && prefersDark)
          if (dark) document.documentElement.classList.add('dark')
        } catch (_) {
          // ignore; default light
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
