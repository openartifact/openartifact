<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Offline - OpenArtifact</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #f9fafb;
        --surface: #ffffff;
        --fg: #111827;
        --muted: #5c6473;
        --border: #e5e7eb;
        --primary: #4f46e5;
        --primary-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #090b13;
          --surface: #111420;
          --fg: #ebeef5;
          --muted: #94a3b8;
          --border: #242a3a;
          --primary: #818cf8;
          --primary-fg: #111827;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 24rem;
        padding: 1.5rem;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
      }
      svg { width: 2.5rem; height: 2.5rem; color: var(--primary); }
      h1 { margin: 1rem 0 0.5rem; font-size: 1.125rem; font-weight: 600; }
      p { margin: 0 0 1.25rem; font-size: 0.875rem; line-height: 1.5; color: var(--muted); }
      a {
        display: inline-block;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        background: var(--primary);
        color: var(--primary-fg);
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }
      a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="13" y="10" width="10" height="10" fill="currentColor" fill-opacity="0.7" />
        <path d="M5 11v15.25h22V11" fill="none" stroke="currentColor" stroke-width="3.5" />
        <path d="M3.5 9.5L13 3" fill="none" stroke="currentColor" stroke-width="3.5" />
      </svg>
      <h1>You are offline</h1>
      <p><span data-product-name>OpenArtifact</span> needs a connection to the server. Nothing is shown from a previous session. Check your network and try again.</p>
      <a href="">Try again</a>
    </main>
    <script src="/offline-brand.js"></script>
  </body>
</html>
