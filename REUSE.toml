version = 1
SPDX-PackageName = "OpenArtifact"
SPDX-PackageSupplier = "The OpenArtifact Authors"
SPDX-PackageDownloadLocation = "https://github.com/openartifact/openartifact"

# sqlc query sources (header would leak into generated docs), generated code (sqlc, hey-api), lockfiles, binary assets and data files
# that cannot carry comment headers.
[[annotations]]
path = [
  "internal/database/dbsqlc/**",
  "internal/database/queries/**",
  "web/src/api/generated/**",
  "internal/api/openapi.json",
  "go.sum",
  "tools/go.sum",
  "web/bun.lock",
  "web/package.json",
  "web/tsconfig.json",
  "web/tsconfig.node.json",
  "web/dist/**",
  "docs/**.png",
  "web/public/**",
  "web/src/**/__snapshots__/**",
  "VERSION",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The OpenArtifact Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Binary rpm test fixture (built from a trivial spec with rpmbuild).
[[annotations]]
path = "pkg/rpm/testdata/weakdeps.rpm"
precedence = "aggregate"
SPDX-FileCopyrightText = "The OpenArtifact Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Binary rpm size fixtures (rpm format 4 and 6, built from testdata/sizes.spec).
[[annotations]]
path = ["pkg/rpm/testdata/sizes-v4.rpm", "pkg/rpm/testdata/sizes-v6.rpm"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The OpenArtifact Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Agent skills vendored unmodified from samber/cc-skills-golang (see .agents/skills/README.md).
[[annotations]]
path = [".agents/skills/golang-*/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Samuel Berthe"
SPDX-License-Identifier = "MIT"

# Agent skills vendored unmodified from vuejs-ai/skills (see .agents/skills/README.md).
[[annotations]]
path = [".agents/skills/vue-*/**"]
precedence = "override"
SPDX-FileCopyrightText = "2025 hyf0, SerKo <https://github.com/serkodev>"
SPDX-License-Identifier = "MIT"

# JSON Schemas vendored unmodified as test fixtures (internal/webhook/format_test.go).
[[annotations]]
path = "internal/webhook/testdata/cloudevents-schema-1.0.2.json"
precedence = "override"
SPDX-FileCopyrightText = "CloudEvents Authors (https://github.com/cloudevents/spec)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "internal/webhook/testdata/adaptive-card-schema-1.5.json"
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation (https://github.com/microsoft/AdaptiveCards)"
SPDX-License-Identifier = "MIT"

# Golden webhook bodies compared byte for byte by internal/webhook/format_test.go.
[[annotations]]
path = "internal/webhook/testdata/golden/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "The OpenArtifact Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
