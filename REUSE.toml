version = 1
SPDX-PackageName = "OpenArtifact"
SPDX-PackageSupplier = "The OpenArtifact Authors"
SPDX-PackageDownloadLocation = "https://github.com/openartifact/openartifact"

# sqlc query sources (header would leak into generated docs), generated code (sqlc, hey-api), lockfiles, binary assets and data files
# that cannot carry comment headers.
[[annotations]]
path = [
  "internal/database/dbsqlc/**",
  "internal/database/queries/**",
  "web/src/api/generated/**",
  "internal/api/openapi.json",
  "internal/vuln/scanners_manifest.json",
  "go.sum",
  "tools/go.sum",
  "web/bun.lock",
  "web/package.json",
  "web/tsconfig.json",
  "web/tsconfig.node.json",
  "web/tsconfig.sw.json",
  "web/dist/**",
  "docs/**.png",
  "web/public/**",
  "web/src/**/__snapshots__/**",
  "internal/clientsetup/testdata/web_parity.json",
  "internal/repotype/testdata/web_parity.json",
  "VERSION",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The OpenArtifact Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Binary rpm test fixture (built from testdata/weakdeps.spec).
[[annotations]]
path = "pkg/rpm/testdata/weakdeps.rpm"
precedence = "aggregate"
SPDX-FileCopyrightText = "The OpenArtifact Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Binary rpm size fixtures (rpm format 4 and 6, built from testdata/sizes.spec).
[[annotations]]
path = ["pkg/rpm/testdata/sizes-v4.rpm", "pkg/rpm/testdata/sizes-v6.rpm", "pkg/rpmsign/testdata/hello.rpm"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The OpenArtifact Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Agent skills vendored unmodified from samber/cc-skills-golang (see .agents/skills/README.md).
[[annotations]]
path = [".agents/skills/golang-*/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Samuel Berthe"
SPDX-License-Identifier = "MIT"

# Agent skills vendored unmodified from vuejs-ai/skills (see .agents/skills/README.md).
[[annotations]]
path = [".agents/skills/vue-*/**"]
precedence = "override"
SPDX-FileCopyrightText = "2025 hyf0, SerKo <https://github.com/serkodev>"
SPDX-License-Identifier = "MIT"

# JSON Schemas vendored unmodified as test fixtures (internal/webhook/format_test.go).
[[annotations]]
path = "internal/webhook/testdata/cloudevents-schema-1.0.2.json"
precedence = "override"
SPDX-FileCopyrightText = "CloudEvents Authors (https://github.com/cloudevents/spec)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "internal/webhook/testdata/adaptive-card-schema-1.5.json"
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation (https://github.com/microsoft/AdaptiveCards)"
SPDX-License-Identifier = "MIT"

# Golden webhook bodies compared byte for byte by internal/webhook/format_test.go.
[[annotations]]
path = "internal/webhook/testdata/golden/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "The OpenArtifact Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Go fuzz corpus entries (testdata/fuzz/FuzzX/<hash>, "go test fuzz v1" files written by `go test`) are
# regression inputs found by fuzzing; the format has no room for a comment header.
[[annotations]]
path = "**/testdata/fuzz/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "The OpenArtifact Authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Official brand artwork (openartifact/brand): lockups, marks, favicon and the icons derived from the mark.
# Later annotations win over the generic web/public/** entry above.
[[annotations]]
path = [
  "web/src/assets/brand/**",
  "web/public/favicon.svg",
  "web/public/favicon-32.png",
  "web/public/icons/**",
]
precedence = "override"
SPDX-FileCopyrightText = "The OpenArtifact Authors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Scalar API reference standalone bundle (@scalar/api-reference, vendored by
# scripts/update-scalar.sh; embedded into the server binary, gzip-compressed).
[[annotations]]
path = "internal/api/apiref/scalar-*.js.gz"
precedence = "override"
SPDX-FileCopyrightText = "Scalar (https://github.com/scalar/scalar)"
SPDX-License-Identifier = "MIT"
